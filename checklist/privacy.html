<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="privacy.tab"></title>
  <meta name="description" content="Privacy Policy for the CheckList app. Learn how CheckList handles user data and protects your privacy.">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin:0; color:#0f172a; }
    header { padding:62px 24px 24px; text-align:left; background:#f8fafc; position:relative; }
    header > div:last-child { max-width:820px; margin:0 auto; }
    header img { width:38px; height:38px; border-radius:22%; border:1px solid #e2e8f0; }
    header p { margin:0; }
    h1 { font-size:28px; margin:12px 0; }
    h2 { margin-top:20px; font-size:20px; }
    p { color:#334155; line-height:1.6; }
    
    #support-form { max-width:520px; }
    #support-form input, #support-form textarea { box-sizing:border-box; width:100%; padding:12px; margin-bottom:12px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:#0f172a; font:inherit; }
    #support-form textarea { display:block; resize:vertical; }
    #support-form button { padding:12px 16px; border:1px solid #0f172a; border-radius:12px; background:#0f172a; color:#fff; cursor:pointer; font:inherit; transition:transform .2s ease; }
    #support-form button:hover { transform:scale(1.05); }
    #support-form button:disabled { opacity:.6; cursor:default; transform:none; }
    #support-status { margin:12px 0 0; }

    .back { position:absolute; left:12px; top:12px; }
    .back button { width:38px; height:38px; border:1px solid #cbd5e1; background:#fff; border-radius:10px; cursor:pointer; font-size:20px; font-weight:bold; line-height:1; padding:0; }
    .back button:hover { background:#f8fafc; }

    .theme { position:absolute; right:112px; top:12px; }
    .theme button { width:38px; height:38px; border:1px solid #cbd5e1; background:#fff; border-radius:10px; cursor:pointer; font-size:20px; padding:0; }
    .theme button:hover { background:#f8fafc; }

    .lang { position:absolute; right:12px; top:12px; display:flex; gap:8px; }
    .lang button { width:38px; height:38px; border:1px solid #cbd5e1; background:#fff; border-radius:10px; cursor:pointer; padding:0; font:inherit; }
    .lang button.active { background:#0f172a; color:#fff; border-color:#0f172a; }
    .lang button:not(.active):hover { background:#f8fafc; }
    
    .privacy-back { margin-top:32px; }
    .back-link { text-decoration:none; font-weight:500; }
    .back-link:hover { text-decoration:underline; }
    footer { text-align:center; color:#64748b; padding:32px 24px; }
    
    .back button, .theme button, .lang button { color:#0f172a; }
    .back button, .theme button, .lang button { transition:transform .2s ease; }
    .back button:hover, .theme button:hover, .lang button:hover { transform:scale(1.05); }

    .content { max-width:820px; margin:0 auto; padding:8px 24px 24px; }
    .content > h2:first-child { margin-top:16px; }

    body.dark { background:#0f172a; color:#f8fafc; }
    body.dark header { background:#1e293b; }
    body.dark p { color:#cbd5e1; }
    body.dark h1, body.dark h2 { color:#f8fafc; }
    body.dark a { color:#f8fafc; }
    body.dark .back button, body.dark .lang button { background:#1e293b; color:#f8fafc; border-color:#334155; }
    body.dark .lang button.active { background:#334155; color:#f8fafc; border-color:#334155; }
    body.dark .back button:hover { background:#334155; color:#f8fafc; border-color:#334155; }
    body.dark .theme button { background:#1e293b; color:#f8fafc; border-color:#334155; }
    body.dark .theme button:hover { background:#334155; color:#f8fafc; border-color:#334155; }
    body.dark .lang button:not(.active):hover { background:#334155; }
    body.dark #support-form input, body.dark #support-form textarea { background:#1e293b; color:#f8fafc; border-color:#334155; }
    body.dark #support-form input::placeholder, body.dark #support-form textarea::placeholder { color:#94a3b8; }
    body.dark #support-form button { background:#f8fafc; color:#0f172a; border-color:#f8fafc; }
    body.dark footer { color:#cbd5e1; }
  </style>
</head>

<body>

  <header>
    <div class="back">
      <button onclick="location.href='index.html'">←</button>
    </div>

    <div class="theme">
      <button id="btn-theme" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="lang">
      <button id="btn-en" onclick="setLang('en')">EN</button>
      <button id="btn-ru" onclick="setLang('ru')">RU</button>
    </div>

    <div>
      <div style="display:flex; align-items:center; gap:8px; font-size:26px; font-weight:600;">
        <img src="assets/_checklist_icon.png" alt="">CheckList
      </div>
      <h1 data-i18n="privacy.title"></h1>
      <p data-i18n="privacy.effective"></p>
    </div>
  </header>

  <main class="content">

    <h2 data-i18n="p.intro.h2"></h2>
    <p data-i18n="p.intro.p"></p>

    <h2 data-i18n="p.scope.h2"></h2>
    <p data-i18n="p.scope.p"></p>

    <h2 data-i18n="p.use.h2"></h2>
    <p data-i18n="p.use.p"></p>

    <h2 data-i18n="p.storage.h2"></h2>
    <p data-i18n="p.storage.p"></p>

    <h2 data-i18n="p.share.h2"></h2>
    <p data-i18n="p.share.p"></p>

    <h2 data-i18n="p.rights.h2"></h2>
    <p data-i18n="p.rights.p"></p>

    <h2 data-i18n="p.age.h2"></h2>
    <p data-i18n="p.age.p"></p>

    <h2 data-i18n="p.changes.h2"></h2>
    <p data-i18n="p.changes.p"></p>

    <h2 data-i18n="p.contact.h2"></h2>
    <p>
      <span data-i18n="p.contact.p"></span>
      <a href="#support-form" onclick="toggleSupport(event)" data-i18n="support.contact"></a>
    </p>

    <form id="support-form" onsubmit="sendSupport(event)" hidden>
      <input type="hidden" name="subject" value="CheckList • Support">
      <input type="email" name="email" data-i18n-placeholder="support.email" maxlength="254" autocomplete="email" required>
      <textarea name="message" data-i18n-placeholder="support.message" maxlength="5000" rows="5" required></textarea>
      <button type="submit" data-i18n="support.send"></button>
      <p id="support-status" role="status" aria-live="polite"></p>
    </form>

    <p class="privacy-back">
      <a href="index.html" class="back-link" data-i18n="privacy.back"></a>
    </p>

  </main>

  <footer>
    <small data-i18n="footer.copy"></small>
  </footer>


  <!-- ENGLISH -->

  <script>

  // КОНТЕНТ

  function parseContent(id) {
    const source = document.getElementById(id).textContent.trim();
    const result = {};
    let key = null;
    let lines = [];

    function save() {
      if (key) result[key] = lines.join('\n').trim();
    }

    source.split('\n').forEach(line => {
      const match = line.match(/^\[([^\]]+)\]\s*$/);
      if (match) {
        save();
        key = match[1];
        lines = [];
      } else if (key) {
        lines.push(line);
      }
    });

    save();
    return result;
  }

  const i18n = {
    en: parseContent('content-en'),
    ru: parseContent('content-ru')
  };


  // ТЕМА

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    document.getElementById('btn-theme').textContent = dark ? '☀️' : '🌙';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }


  // ЯЗЫК

  function setLang(lang) {
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
    document.getElementById('support-status').textContent = '';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      const text = i18n[lang][key];

      if (text !== undefined) {
        el.textContent = text;
      }
    });
    
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = i18n[lang][el.dataset.i18nPlaceholder] || '';
    });

    document.querySelectorAll('.lang button').forEach(button => button.classList.remove('active'));
    const button = document.getElementById('btn-' + lang);
    if (button) button.classList.add('active');
  }

  function initLang(defaultLang = 'en') {
    const stored = localStorage.getItem('lang');
    setLang(stored || defaultLang);

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('btn-theme').textContent = '☀️';
    }
  }
  
  
  // ПОДДЕРЖКА
  
  function toggleSupport(event) {
    event.preventDefault();
    const form = document.getElementById('support-form');
    form.hidden = !form.hidden;
  }

  async function sendSupport(event) {
    event.preventDefault();
    const form = event.target;
    const button = form.querySelector('button[type="submit"]');
    const status = document.getElementById('support-status');
    const lang = document.documentElement.lang === 'ru' ? 'ru' : 'en';

    button.disabled = true;
    button.textContent = i18n[lang]['support.sending'];
    status.textContent = '';

    try {
      const response = await fetch('https://formspree.io/f/xeaadozo', {
        method: 'POST',
        body: new FormData(form),
        headers: { Accept: 'application/json' }
      });

      if (!response.ok) throw new Error('Submission failed');

      form.reset();
      status.textContent = i18n[lang]['support.success'];
    } catch {
      status.textContent = i18n[lang]['support.error'];
    } finally {
      button.disabled = false;
      button.textContent = i18n[document.documentElement.lang === 'ru' ? 'ru' : 'en']['support.send'];
    }
  }


  // ИНИЦИАЛИЗАЦИЯ

  document.addEventListener('DOMContentLoaded', initLang);

  </script>

</body>
</html>
